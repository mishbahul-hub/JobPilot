name: Refresh jobs index

on:
  schedule:
    - cron: "30 1 * * *" # daily, 07:00 IST
  workflow_dispatch:
    inputs:
      pages:
        description: "Pages per query (50 jobs each)"
        default: "5"

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
      - run: uv sync --frozen --no-dev
      - name: Ingest from Adzuna
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: ../.venv/bin/python -m app.ingest.pipeline adzuna --pages ${{ inputs.pages || '5' }}
