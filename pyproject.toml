[project]
name = "jobpilot"
version = "0.1.0"
description = "AI job-matching agent: hybrid search over a live jobs index, tool-using LLM agent with memory, and evals."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Database
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    # LLM / agent
    "langchain-core>=0.3",
    "langchain-google-genai>=2.0",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    # Ingestion / parsing
    "httpx>=0.27",
    "pypdf>=4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["backend"]
