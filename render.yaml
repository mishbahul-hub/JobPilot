# Render Blueprint: https://render.com/docs/blueprint-spec
# Creates the API (Docker) and the frontend (static site). The database stays on Neon.
# Secrets marked `sync: false` are asked for in the Render dashboard on first deploy.
services:
  - type: web
    name: jobpilot-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: CORS_ORIGINS
        # Must match the frontend URL exactly (update if Render gives a different name).
        value: '["https://jobpilot-web.onrender.com"]'
      - key: LOG_LEVEL
        value: INFO

  - type: web
    name: jobpilot-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: false
    envVars:
      - key: VITE_API_URL
        # Must match the API URL (update if Render gives a different name).
        value: https://jobpilot-api.onrender.com
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
